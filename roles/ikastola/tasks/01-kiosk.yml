#Xfce-ren fitxategiak blokeatzen ditugu, erabiltzaileek aldaketarik ez egiteko. Ikastolako logoa jartzen dugu ere
---
- name: Mahaigaineko defektuzko irudia kopiatu.
  copy:
    src: "/usr/share/backgrounds/xfce/xfce-shapes.svg"
    dest: "/usr/share/backgrounds/xfce/xfce-shapes-orig.svg"
    remote_src: "yes"
    mode: 0644

- name: Mahaigaina aldatzeko scripta kopiatu.
  copy:
    src: "{{ role_path }}/files/usr/local/bin/mahaigaina"
    dest: "/usr/local/bin/mahaigaina"
    mode: 0755

- name: Mahaigaineko defektuzko irudia kendu.
  file:
    path: "/usr/share/backgrounds/xfce/xfce-shapes.svg"
    state: absent

- name: Ikastolako irudiak kopiatu.
  copy:
    src: "{{ role_path }}/files/usr/share/backgrounds/xfce/{{ item.bat }}"
    dest: "/usr/share/backgrounds/xfce/{{ item.bi }}"
    mode: 0644
  with_items:
     - { bat: "ikastola_apirilak_29.png", bi: "astelehena.png" }
     - { bat: "ikastola_maiatzak_06.png", bi: "asteartea.png" }
     - { bat: "ikastola_maiatzak_13.png", bi: "asteazkena.png" }
     - { bat: "ikastola_maiatzak_20.png", bi: "osteguna.png" }
     - { bat: "ikastola_maiatzak_27.png", bi: "ostirala.png" }
     - { bat: "ikastola_gurea_garbi.png", bi: "ikastola.png" }

- name: Mahaigaineko defektuzko irudia ordeztu.
  file:
    src: "/usr/share/backgrounds/xfce/ikastola.png"
    dest: "/usr/share/backgrounds/xfce/xfce-shapes.svg"
    state: link

- name: Zerbitzua kopiatu.
  copy:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "/{{ item }}"
    mode: 0644
  with_items:
    - "etc/systemd/system/mahaigaina.service"

- name: Zerbitzua aktibatu.
  file:
    src: /etc/systemd/system/{{ item }}
    dest: /etc/systemd/system/multi-user.target.wants/{{ item }}
    state: link
  with_items:
    - "mahaigaina.service"

